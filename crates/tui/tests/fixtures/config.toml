# Fixture configuration for the TUI integration tests.
#
# It is deliberately generic — no real repository, credential, or host — and is
# only parsed and normalized; no filesystem path is ever touched.

config_version = 1

[[workspaces]]
id = "acme"
name = "Acme Platform"
root = "~/Projects/acme"

[workspaces.environment]
LOGGING_LEVEL = "INFO"

[[libraries]]
id = "common-core"
name = "common-core"
workspace = "acme"
path = "libraries/common-core"
type = "maven"
build_system = "maven"

[libraries.repository]
url = "git@github.com:acme/common-core.git"
default_branch = "main"

[libraries.commands]
build = "./mvnw clean install"

[libraries.artifact]
group_id = "com.acme"
artifact_id = "common-core"
version = "1.8.0-SNAPSHOT"

[[services]]
id = "auth-service"
name = "auth-service"
type = "backend"
workspace = "acme"
path = "backend/auth-service"
default_branch = "main"
build_system = "maven"

[services.repository]
url = "git@github.com:acme/auth-service.git"

[services.runtime]
type = "java"
version = "21"

[services.commands]
install = "./mvnw dependency:resolve"
build = "./mvnw clean install"
start = "./mvnw spring-boot:run"

[services.liquibase]
enabled = true
provider = "liquibase"
execution_mode = "maven"
timeout_seconds = 300

[services.liquibase.commands]
status = "./mvnw liquibase:status"
update = "./mvnw liquibase:update"
preview = "./mvnw liquibase:updateSQL"

[services.liquibase.database]
environment = "local"
database_type = "postgresql"
name = "acme_auth"
host = "localhost"
schema = "public"

[services.environment]
SPRING_PROFILES_ACTIVE = "local"

[services.dependencies]
libraries = ["common-core"]

[[services.ports]]
port = 8081
protocol = "tcp"

[[services.health_checks]]
type = "http"
url = "http://localhost:8081/actuator/health"
timeout_seconds = 10

[[services]]
id = "web-ui"
name = "web-ui"
type = "frontend"
workspace = "acme"
path = "frontend/web-ui"
default_branch = "main"
build_system = "npm"

[services.repository]
url = "git@github.com:acme/web-ui.git"

[services.runtime]
type = "node"
version = "20.x"

[services.commands]
install = "npm install"
build = "npm run build"
start = "npm start"

[services.environment]
SERVER_PORT = "3000"

[services.dependencies]
services = ["auth-service"]

[[services.ports]]
port = 3000
protocol = "tcp"

[[services.health_checks]]
type = "port"
port = 3000

[[groups]]
id = "customer"
name = "Customer Management"
services = ["auth-service", "web-ui"]

[execution]
max_parallel_tasks = 4
default_timeout_seconds = 1800
