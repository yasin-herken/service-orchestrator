[package]
name = "service-orchestrator-config"
description = "Versioned configuration loading, parsing, validation, and migration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
service-orchestrator-domain.workspace = true
# Serialization is required for the raw TOML models. `serde` is compile-time
# only and does not couple the crate to any runtime.
serde.workspace = true
# Structured configuration errors.
thiserror.workspace = true
# The TOML parser. TOML is contained to this crate; no other layer parses it.
toml.workspace = true
