# Service Orchestrator — Cargo workspace root.
#
# The root package is the composition root: it wires concrete infrastructure
# implementations into the application core and hands that core to the TUI and
# MCP interface adapters. Business logic must never live here.

[workspace]
resolver = "2"
members = ["crates/*"]
# The Tauri desktop app carries its own toolchain-facing workspace (Tauri 2,
# `wry`, `tao`) and is developed with `npm run tauri dev`; it consumes the
# workspace crates as path dependencies but is not a member of this workspace
# (`tasks/018.md` §5).
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The official MCP Rust SDK (`rmcp`) requires Rust 1.88 / edition 2024, so the
# workspace MSRV is raised to match the highest requirement of its dependencies.
rust-version = "1.88.0"
license = "Apache-2.0"
authors = ["Service Orchestrator contributors"]

# Shared lint policy. Every crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

# External crates shared across the workspace. Keeping versions here (rather
# than per-crate) ensures every crate agrees on the same version and makes
# dependency changes visible in a single place.
[workspace.dependencies]
async-trait = "0.1.89"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
nix = { version = "0.29", default-features = false, features = ["signal", "process"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.19"
# Official Rust SDK for the Model Context Protocol. Only the server and the
# stdio transport are enabled; no HTTP transport, macros, auth, or client is
# pulled in. `schemars` is enabled transitively by the `server` feature and is
# also declared directly so the derive macro resolves in this workspace.
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
schemars = "1.0"
time = { version = "0.3.53", features = ["serde", "macros"] }
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "process", "io-util", "net"] }
toml = "0.8"
# Format-preserving TOML editing. Used by the configuration management layer so
# a mutation rewrites only the edited array of tables and preserves comments and
# formatting everywhere else (`tasks/023.md` §37). The `serde` feature provides
# `toml_edit::ser`, used to turn a typed entity back into a TOML table.
toml_edit = { version = "0.22", features = ["serde"] }

# Internal crates. Path dependencies keep the workspace building offline and
# make the intended dependency direction explicit and enforceable.
service-orchestrator-domain = { path = "crates/domain", version = "0.1.0" }
service-orchestrator-application = { path = "crates/application", version = "0.1.0" }
service-orchestrator-config = { path = "crates/config", version = "0.1.0" }
service-orchestrator-execution = { path = "crates/execution", version = "0.1.0" }
service-orchestrator-git = { path = "crates/git", version = "0.1.0" }
service-orchestrator-process = { path = "crates/process", version = "0.1.0" }
service-orchestrator-build = { path = "crates/build", version = "0.1.0" }
service-orchestrator-runtime = { path = "crates/runtime", version = "0.1.0" }
service-orchestrator-liquibase = { path = "crates/liquibase", version = "0.1.0" }
service-orchestrator-health = { path = "crates/health", version = "0.1.0" }
service-orchestrator-logging = { path = "crates/logging", version = "0.1.0" }
service-orchestrator-policy = { path = "crates/policy", version = "0.1.0" }
service-orchestrator-repository = { path = "crates/repository", version = "0.1.0" }
service-orchestrator-mcp = { path = "crates/mcp", version = "0.1.0" }
service-orchestrator-tui = { path = "crates/tui", version = "0.1.0" }
service-orchestrator-client = { path = "crates/client", version = "0.1.0" }
service-orchestrator-daemon = { path = "crates/daemon", version = "0.1.0" }

[package]
name = "service-orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "macOS-native developer environment orchestration platform"
publish = false

[lints]
workspace = true

[dependencies]
service-orchestrator-application.workspace = true
service-orchestrator-build.workspace = true
service-orchestrator-client.workspace = true
service-orchestrator-config.workspace = true
service-orchestrator-daemon.workspace = true
service-orchestrator-domain.workspace = true
service-orchestrator-execution.workspace = true
service-orchestrator-git.workspace = true
service-orchestrator-health.workspace = true
service-orchestrator-liquibase.workspace = true
service-orchestrator-logging.workspace = true
service-orchestrator-mcp.workspace = true
service-orchestrator-policy.workspace = true
service-orchestrator-process.workspace = true
service-orchestrator-repository.workspace = true
service-orchestrator-runtime.workspace = true
service-orchestrator-tui.workspace = true
# Used by the read-only repository inspector to parse `package.json`.
serde_json.workspace = true
tokio.workspace = true
