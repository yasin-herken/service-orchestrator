# Example Service Orchestrator configuration.
#
# This file is deliberately generic: it demonstrates every supported section
# without referencing any real company, repository, or credential. Copy it to
# ~/.service-orchestrator/config.toml and adapt it.
#
# Run `service-orchestrator` against it once the application is wired up.
# Validation rules are documented in docs/configuration.md.

config_version = 1

# ---------------------------------------------------------------------------
# Workspaces
# ---------------------------------------------------------------------------

[[workspaces]]
id = "acme"
name = "Acme Platform"
root = "~/Projects/acme"

[workspaces.environment]
LOGGING_LEVEL = "INFO"

# ---------------------------------------------------------------------------
# Libraries
# ---------------------------------------------------------------------------

[[libraries]]
id = "common-core"
name = "common-core"
workspace = "acme"
path = "libraries/common-core"
type = "maven"
build_system = "maven"

[libraries.repository]
url = "git@github.com:acme/common-core.git"
default_branch = "main"

[libraries.commands]
build = "./mvnw clean install"

[libraries.artifact]
group_id = "com.acme"
artifact_id = "common-core"
version = "1.8.0-SNAPSHOT"

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------

[[services]]
id = "auth-service"
name = "auth-service"
type = "backend"
workspace = "acme"
path = "backend/auth-service"
default_branch = "main"
build_system = "maven"

[services.repository]
url = "git@github.com:acme/auth-service.git"

[services.runtime]
type = "java"
version = "21"

[services.commands]
install = "./mvnw dependency:resolve"
build = "./mvnw clean install"
start = "./mvnw spring-boot:run"

[services.liquibase]
enabled = true
provider = "liquibase"
execution_mode = "maven"
timeout_seconds = 300
preset = "status"

[services.liquibase.commands]
status = "./mvnw liquibase:status"
update = "./mvnw liquibase:update"
preview = "./mvnw liquibase:updateSQL"

[services.liquibase.database]
environment = "local"
database_type = "postgresql"
name = "acme_auth"
host = "localhost"
schema = "public"

[services.environment]
SPRING_PROFILES_ACTIVE = "local"

[services.dependencies]
libraries = ["common-core"]

[[services.ports]]
port = 8081
protocol = "tcp"

[[services.health_checks]]
type = "http"
url = "http://localhost:8081/actuator/health"
timeout_seconds = 10

[[services]]
id = "web-ui"
name = "web-ui"
type = "frontend"
workspace = "acme"
path = "frontend/web-ui"
default_branch = "main"
build_system = "npm"

[services.repository]
url = "git@github.com:acme/web-ui.git"

[services.runtime]
type = "node"
version = "20.x"

[services.commands]
install = "npm install"
build = "npm run build"
start = "npm start"

[services.environment]
SERVER_PORT = "3000"

[services.dependencies]
services = ["auth-service"]

[[services.ports]]
port = 3000
protocol = "tcp"

[[services.health_checks]]
type = "port"
port = 3000

# ---------------------------------------------------------------------------
# Groups
# ---------------------------------------------------------------------------

[[groups]]
id = "customer"
name = "Customer Management"
services = ["auth-service", "web-ui"]

# ---------------------------------------------------------------------------
# Profiles
# ---------------------------------------------------------------------------

[[profiles]]
id = "full-stack"
name = "Full Stack"
services = ["auth-service"]
groups = ["customer"]

# ---------------------------------------------------------------------------
# Repository discovery
# ---------------------------------------------------------------------------
#
# Bounds the recursive scan behind the bulk-import wizard. The built-in
# excludes (.git, node_modules, target, build, dist, out) always apply; the
# list below adds project-specific directories. `max_depth` defaults to 6
# (hard cap 64) and `max_repositories` defaults to 200.

[discovery]
max_depth = 6
exclude = ["external", "generated"]
follow_symlinks = true
max_repositories = 200

# ---------------------------------------------------------------------------
# Service templates
# ---------------------------------------------------------------------------
#
# Templates supply reusable defaults for services created by the bulk-import
# wizard. A template never carries credentials, ports, or repository URLs, and
# its values may use ${serviceName}, ${repositoryName}, ${repositoryPath},
# ${workspaceRoot}, ${relativePath}, and ${port}. They are suggestions: the
# wizard always shows the resolved result before anything is written.
# See docs/service-templates.md.

[[templates]]
id = "spring-boot-backend"
name = "Spring Boot Backend"
description = "Spring Boot 3 service on Java 21, built with the Maven wrapper."
category = "spring_boot_backend"
type = "backend"
default_branch = "main"
build_system = "maven"
build_operation = "build"

[templates.runtime]
type = "java"
version = "21"

[templates.commands]
install = "./mvnw dependency:resolve"
build = "./mvnw clean install"
start = "./mvnw spring-boot:run"
test = "./mvnw test"

[templates.liquibase]
enabled = true
execution_mode = "maven"
preset = "status"

[[templates.health_checks]]
type = "http"
url = "http://localhost:${port}/actuator/health"
timeout_seconds = 10

[templates.environment]
SPRING_PROFILES_ACTIVE = "local"

[[templates]]
id = "react-frontend"
name = "React Frontend"
description = "Node 20 single-page application built with npm."
category = "react_frontend"
type = "frontend"
default_branch = "main"
build_system = "npm"

[templates.runtime]
type = "node"
version = "20.x"

[templates.commands]
install = "npm install"
build = "npm run build"
start = "npm start"
test = "npm test"

[[templates]]
id = "maven-library"
name = "Shared Maven Library"
description = "Shared library installed into the local Maven repository."
category = "shared_maven_library"
type = "library"
default_branch = "main"
build_system = "maven"

[templates.commands]
build = "./mvnw clean install"
test = "./mvnw test"

# ---------------------------------------------------------------------------
# Named migration presets
# ---------------------------------------------------------------------------
#
# A preset names a structured set of Liquibase goals and its safety class; it
# is never a raw command. `status`, `update`, and `reset_local` are built in,
# and a user preset with the same id replaces its built-in. A destructive
# preset must declare the environments it may target — and that declaration is
# a precondition, not authorization: every execution still requires explicit
# confirmation. See docs/migration-presets.md.

[[migration_presets]]
id = "validate"
name = "Validate"
description = "Validate changelogs without touching the database."
goals = ["liquibase:validate"]
read_only = true

[[migration_presets]]
id = "sql-preview"
name = "SQL Preview"
description = "Render the SQL that `update` would run, without applying it."
goals = ["liquibase:updateSQL"]
contexts = ["local"]
read_only = true

[[migration_presets]]
id = "reset-local"
name = "Reset Local Database"
description = "Drop every object and re-apply all change sets. Destructive."
goals = ["liquibase:dropAll", "liquibase:update"]
contexts = ["local"]
destructive = true
allowed_environments = ["local"]

# ---------------------------------------------------------------------------
# Saved bulk-operation presets
# ---------------------------------------------------------------------------
#
# A preset stores the selection of operations a developer commonly runs; it
# never stores credentials or authorization and never executes on load.
# Loading one pre-fills the Bulk Operations screen, and execution re-runs the
# full validation and policy. See docs/bulk-operations.md.

[[operation_presets]]
id = "full-stack-local"
name = "Full Stack (Local)"
description = "Sync, build libraries, migrate, restart, and verify the full stack."
workspace = "acme"
profiles = ["full-stack"]
default = true

[operation_presets.git]
enabled = true

[operation_presets.libraries]
enabled = true

[operation_presets.migration]
enabled = true
preset = "update"

[operation_presets.build]
enabled = true
operation = "build"

[operation_presets.runtime]
action = "restart"

[operation_presets.health]
enabled = true

# ---------------------------------------------------------------------------
# Execution settings
# ---------------------------------------------------------------------------

[execution]
max_parallel_tasks = 4
default_timeout_seconds = 1800
